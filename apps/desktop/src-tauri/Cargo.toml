[package]
name = "lotto-lab-desktop"
version = "0.1.0"
description = "LOTTO LAB Windows 앱 (Tauri 2)"
edition = "2021"
rust-version = "1.85"
publish = false
license = "UNLICENSED"

[lib]
name = "lotto_lab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-store = "2.5.1"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-opener = "2.7.3"
# CSV 저장 대화상자(task-027) — Rust 측 blocking_save_file만 쓴다. 프런트에는 dialog 권한을 주지 않는다.
tauri-plugin-dialog = "2.8.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
