# cargo-deny 설정(task-010) — `cargo deny check licenses` (src-tauri에서). GPL·AGPL·LGPL 등 강한 copyleft는 허용 목록에 넣지 않는다.
# 허용 목록 밖 라이선스가 나오면 실패한다. 추가는 secscan license 기준으로 팀장 확인 후.
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-3-Clause",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
]

[licenses.private]
ignore = true

[advisories]
yanked = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
